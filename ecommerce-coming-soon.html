<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-commerce Website | Coming Soon</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Base Styles */
        :root {
            --primary-color: #4ade80;
            --primary-dark: #22c55e;
            --primary-light: #86efac;
            --secondary-color: #3b82f6;
            --dark-color: #0f172a;
            --darker-color: #0a0f1d;
            --light-color: #f8fafc;
            --gray-color: #94a3b8;
            --gray-light: #e2e8f0;
            --gray-dark: #334155;
            --font-primary: 'Poppins', sans-serif;
            --font-code: 'Roboto Mono', monospace;
            --transition: all 0.3s ease;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
            --border-radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-primary);
            line-height: 1.6;
            color: var(--light-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* Background styles */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(8px);
            transform: scale(1.1); /* Prevent blur edges from showing */
        }

        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.85); /* Dark overlay */
            z-index: 1;
        }

        body.light-theme .background-overlay {
            background-color: rgba(248, 250, 252, 0.85); /* Light overlay */
        }

        /* Light Theme Styles */
        body.light-theme {
            --primary-color: #4ade80;
            --primary-dark: #22c55e;
            --primary-light: #86efac;
            --secondary-color: #3b82f6;
            --dark-color: #f8fafc;
            --darker-color: #e2e8f0;
            --light-color: #0f172a;
            --gray-color: #64748b;
            --gray-light: #334155;
            --gray-dark: #cbd5e1;
            color: var(--light-color);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* Header Styles */
        header {
            background-color: rgba(10, 15, 29, 0.8); /* Semi-transparent header */
            padding: 15px 0;
            box-shadow: var(--shadow);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            position: relative;
            z-index: 10;
        }

        body.light-theme header {
            background-color: rgba(226, 232, 240, 0.8);
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            position: relative;
            z-index: 5;
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo a {
            display: flex;
            align-items: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
            font-family: var(--font-code);
        }

        .theme-toggle {
            font-size: 1.2rem;
            color: var(--light-color);
            cursor: pointer;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            color: var(--primary-color);
        }

        /* Main Content */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 0;
            position: relative;
            z-index: 5;
        }

        .coming-soon {
            text-align: center;
            max-width: 800px;
            padding: 60px 40px;
            background-color: rgba(10, 15, 29, 0.8); /* Semi-transparent background */
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-md);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        body.light-theme .coming-soon {
            background-color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .coming-soon h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: var(--primary-color);
            font-family: var(--font-code);
        }

        .coming-soon h2 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: var(--light-color);
        }

        .coming-soon p {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: var(--gray-color);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn {
            display: inline-block;
            padding: 12px 30px;
            border-radius: var(--border-radius);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            margin: 10px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--dark-color);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-3px);
        }

        .project-icon {
            font-size: 5rem;
            color: var(--primary-color);
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
        }

        /* Footer */
        footer {
            background-color: rgba(10, 15, 29, 0.8);
            color: var(--light-color);
            padding: 20px 0;
            text-align: center;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            position: relative;
            z-index: 10;
        }

        body.light-theme footer {
            background-color: rgba(226, 232, 240, 0.8);
        }

        footer p {
            color: var(--gray-color);
            font-size: 0.9rem;
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .coming-soon h1 {
                font-size: 2.5rem;
            }
            
            .coming-soon h2 {
                font-size: 2rem;
            }
            
            .coming-soon p {
                font-size: 1.1rem;
            }
            
            .project-icon {
                font-size: 4rem;
            }
        }

        @media (max-width: 576px) {
            .coming-soon {
                padding: 40px 20px;
            }
            
            .coming-soon h1 {
                font-size: 2rem;
            }
            
            .coming-soon h2 {
                font-size: 1.5rem;
            }
            
            .coming-soon p {
                font-size: 1rem;
            }
            
            .project-icon {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Background with blur -->
    <div class="background-container">
        <!-- E-commerce background image -->
        <img src="/placeholder.svg?height=1080&width=1920&text=E-commerce Platform" alt="E-commerce Background" class="background-image">
        <div class="background-overlay"></div>
    </div>

    <!-- Header -->
    <header>
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <span class="logo-text">&lt;KZ/&gt;</span>
                </a>
            </div>
            <div class="theme-toggle">
                <i class="fas fa-sun"></i>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container">
            <div class="coming-soon">
                <div class="project-icon">
                    <i class="fas fa-shopping-cart"></i>
                </div>
                <h1>E-commerce Platform</h1>
                <h2>Coming Soon</h2>
                <p>Our E-commerce Platform is under development. We're building a full-featured online shopping experience with user authentication, product catalog, and secure payment processing.</p>
                
                <div class="buttons">
                    <a href="index.html" class="btn btn-primary">Back to Portfolio</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2025 Kaleab Zelalem. All Rights Reserved.</p>
        </div>
    </footer>

    <script>
        // Wait for DOM to load
        document.addEventListener("DOMContentLoaded", () => {
            // Theme toggle
            const themeToggle = document.querySelector(".theme-toggle");
            const themeIcon = themeToggle.querySelector("i");
            
            // Check for saved theme preference
            const savedTheme = localStorage.getItem("theme");
            
            if (savedTheme === "light") {
                document.body.classList.add("light-theme");
                themeIcon.classList.remove("fa-sun");
                themeIcon.classList.add("fa-moon");
            }
            
            themeToggle.addEventListener("click", () => {
                document.body.classList.toggle("light-theme");
                
                if (document.body.classList.contains("light-theme")) {
                    themeIcon.classList.remove("fa-sun");
                    themeIcon.classList.add("fa-moon");
                    localStorage.setItem("theme", "light");
                } else {
                    themeIcon.classList.remove("fa-moon");
                    themeIcon.classList.add("fa-sun");
                    localStorage.setItem("theme", "dark");
                }
            });
        });
    </script>
</body>
</html>
